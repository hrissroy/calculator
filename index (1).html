<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-label="Basic calculator">
        <section class="display-panel" aria-live="polite">
            <div id="expression" class="expression"></div>
            <div id="display" class="display">0</div>
        </section>

        <section class="keypad">
            <button class="fn" data-action="clear" aria-label="All clear">AC</button>
            <button class="fn" data-action="sign" aria-label="Change sign">±</button>
            <button class="fn" data-action="percent" aria-label="Percent">%</button>
            <button class="op" data-action="operator" data-value="/" aria-label="Divide">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="op" data-action="operator" data-value="*" aria-label="Multiply">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="op" data-action="operator" data-value="-" aria-label="Subtract">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="op" data-action="operator" data-value="+" aria-label="Add">+</button>

            <button data-value="0">0</button>
            <button data-action="decimal" aria-label="Decimal point">.</button>
            <button class="fn" data-action="backspace" aria-label="Backspace">⌫</button>
            <button class="equals" data-action="equals" aria-label="Equals">=</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
